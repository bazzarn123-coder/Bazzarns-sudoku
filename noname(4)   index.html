<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bazzarn's Sudoku</title>
  
  <!-- Web App full-screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Custom App Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><rect x='10' y='10' width='80' height='80' rx='5' fill='white'/><path d='M36.6 10v80M63.3 10v80M10 36.6h80M10 63.3h80' stroke='%23007aff' stroke-width='4'/><text x='23' y='30' font-family='sans-serif' font-weight='bold' font-size='16' fill='%23333'>5</text><text x='50' y='57' font-family='sans-serif' font-weight='bold' font-size='16' fill='%23007aff'>3</text><text x='76' y='84' font-family='sans-serif' font-weight='bold' font-size='16' fill='%23333'>9</text></svg>">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23007aff'/><rect x='10' y='10' width='80' height='80' rx='5' fill='white'/><path d='M36.6 10v80M63.3 10v80M10 36.6h80M10 63.3h80' stroke='%23007aff' stroke-width='4'/><text x='23' y='30' font-family='sans-serif' font-weight='bold' font-size='16' fill='%23333'>5</text><text x='50' y='57' font-family='sans-serif' font-weight='bold' font-size='16' fill='%23007aff'>3</text><text x='76' y='84' font-family='sans-serif' font-weight='bold' font-size='16' fill='%23333'>9</text></svg>">

  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start;
      min-height: 100vh; 
      margin: 0; 
      /* Multicolored Marble Background Effect */
      background-color: #e2e8f0;
      background-image: 
        radial-gradient(at 15% 25%, rgba(168, 85, 247, 0.25) 0px, transparent 50%),
        radial-gradient(at 85% 15%, rgba(59, 130, 246, 0.25) 0px, transparent 50%),
        radial-gradient(at 35% 75%, rgba(236, 72, 153, 0.22) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(234, 179, 8, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(20, 184, 166, 0.2) 0px, transparent 60%),
        linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
      padding-top: 25px;
      padding-bottom: 40px;
    }

    h1 { 
      margin-top: 0;
      margin-bottom: 8px; 
      font-size: 26px; 
      color: #1e293b; 
      text-shadow: 0 1px 2px rgba(255,255,255,0.8); 
      z-index: 1;
    }

    /* Difficulty Control Buttons */
    #difficulty-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      z-index: 1;
    }

    .diff-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      border: 2px solid rgba(203, 213, 225, 0.8);
      background: rgba(255, 255, 255, 0.9);
      color: #475569;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .diff-btn.active {
      background: #007aff;
      color: white;
      border-color: #005bb5;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 2px 6px rgba(0,122,255,0.3);
    }

    /* Auto Complete Container & Button */
    #autocomplete-container {
      margin-bottom: 10px;
      min-height: 34px;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auto-btn {
      padding: 6px 14px;
      font-size: 14px;
      font-weight: bold;
      background: #ffcc00;
      color: #000;
      border: 2px solid #b38600;
      border-radius: 6px;
      box-shadow: 0 3px 0 #b38600, 0 4px 10px rgba(255,204,0,0.4);
      cursor: pointer;
      animation: pulse 0.8s infinite alternate;
    }

    .auto-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #b38600;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }
    
    #board { 
      display: grid; 
      grid-template-columns: repeat(9, 1fr); 
      gap: 1px; 
      background: #0f172a; 
      border: 4px solid #0f172a; 
      border-radius: 8px; 
      width: 88vw; 
      max-width: 340px; 
      height: 88vw; 
      max-height: 340px; 
      z-index: 1;
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    }
    
    .cell { 
      background: rgba(255, 255, 255, 0.95); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 19px; 
      font-weight: bold; 
      cursor: pointer; 
      color: #007aff;
    }
    
    .cell.given { 
      background: rgba(241, 245, 249, 0.95); 
      color: #0f172a;
    }
    
    .cell.selected { 
      background: #fef08a !important;
    }
    
    .cell.error { 
      color: #dc2626; 
      background: #fee2e2; 
    }

    .cell.completed { 
      color: #16a34a !important; 
      background: #dcfce7 !important; 
    }

    .cell:nth-child(3n) { border-right: 2px solid #0f172a; }
    .cell:nth-child(9n) { border-right: none; }
    .row-border { border-bottom: 2px solid #0f172a; }

    #keypad { 
      display: grid; 
      grid-template-columns: repeat(5, 1fr); 
      gap: 8px; 
      margin-top: 14px; 
      width: 88vw; 
      max-width: 340px; 
      z-index: 1;
    }
    
    button { 
      padding: 12px 10px; 
      font-size: 18px; 
      font-weight: bold; 
      border: 2px solid rgba(203, 213, 225, 0.9); 
      background: rgba(255, 255, 255, 0.9); 
      color: #1e293b; 
      border-radius: 8px; 
      box-shadow: 0 3px 0 #cbd5e1, 0 4px 8px rgba(0,0,0,0.05);
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    
    button:active { 
      transform: translateY(2px);
      box-shadow: 0 1px 0 #cbd5e1;
    }
    
    button.action { 
      background: rgba(254, 226, 226, 0.9); 
      color: #dc2626;
      border-color: #fca5a5;
      box-shadow: 0 3px 0 #fca5a5;
    }
    button.action:active {
      box-shadow: 0 1px 0 #fca5a5;
    }

    /* Sticky / Permanently On Button Style */
    button.sticky {
      background: #16a34a !important;
      color: white !important;
      border-color: #15803d !important;
      box-shadow: 0 3px 0 #15803d !important;
    }
    button.sticky:active {
      box-shadow: 0 1px 0 #15803d !important;
    }

    /* Instruction Sentence Style */
    .instruction {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      text-shadow: 0 1px 1px rgba(255,255,255,0.7);
      z-index: 1;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1 id="title">Bazzarn's Sudoku</h1>

  <!-- Difficulty Controls -->
  <div id="difficulty-selector">
    <button class="diff-btn" id="btn-easy" onclick="setDifficulty('easy')">Easy</button>
    <button class="diff-btn active" id="btn-medium" onclick="setDifficulty('medium')">Medium</button>
    <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">Hard</button>
  </div>

  <!-- Auto Complete Prompt Container -->
  <div id="autocomplete-container"></div>

  <div id="board"></div>

  <div id="keypad">
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button class="action">C</button>
  </div>

  <!-- Instruction Sentence -->
  <div class="instruction">Press and hold any button to activate sticky keys.</div>

  <script>
    // --- Sudoku Game Logic ---[span_1](start_span)[span_1](end_span)
    let solution = [], puzzle = [], current = [], selectedCell = null;
    let currentDifficulty = 'medium';
    let stickyNum = null; // Holds the permanently switched-on number (1-9) or null[span_2](start_span)[span_2](end_span)

    const difficultyClues = {
      easy: 35,   
      medium: 45, 
      hard: 53    
    };

    function setDifficulty(level) {
      currentDifficulty = level;
      document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`btn-${level}`).classList.add('active');
      initGame();
    }

    function isValid(grid, r, c, num) {
      for (let i = 0; i < 9; i++) {
        if (grid[r][i] === num || grid[i][c] === num) return false;
        let boxR = 3 * Math.floor(r / 3) + Math.floor(i / 3);
        let boxC = 3 * Math.floor(c / 3) + (i % 3);
        if (grid[boxR][boxC] === num) return false;
      }
      return true;
    }

    function solve(grid) {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (grid[r][c] === 0) {
            let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
            for (let num of nums) {
              if (isValid(grid, r, c, num)) {
                grid[r][c] = num;
                if (solve(grid)) return true;
                grid[r][c] = 0;
              }
            }
            return false;
          }
        }
      }
      return true;
    }

    function initGame() {
      solution = Array.from({length: 9}, () => Array(9).fill(0));
      solve(solution);
      puzzle = JSON.parse(JSON.stringify(solution));
      
      let count = difficultyClues[currentDifficulty];
      while (count > 0) {
        let r = Math.floor(Math.random() * 9), c = Math.floor(Math.random() * 9);
        if (puzzle[r][c] !== 0) { puzzle[r][c] = 0; count--; }
      }
      current = JSON.parse(JSON.stringify(puzzle));
      selectedCell = null;
      stickyNum = null;
      render();
    }

    function checkWinCondition() {
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (current[r][c] === 0 || current[r][c] !== solution[r][c]) {
            return false;
          }
        }
      }
      return true;
    }

    function render() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const isWon = checkWinCondition();

      if (isWon) {
        document.getElementById('title').innerText = "🎉 Bazzarn Sudoku Solved! 🎉";
      } else {
        document.getElementById('title').innerText = "Bazzarn's Sudoku";
      }

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          
          if (Math.floor(r / 3) !== Math.floor((r + 1) / 3) && r < 8) cell.classList.add('row-border');
          
          if (isWon) {
            cell.classList.add('completed');
          } else if (puzzle[r][c] !== 0) {
            cell.classList.add('given');
          } else if (current[r][c] !== 0) {
            if (current[r][c] !== solution[r][c]) {
              cell.classList.add('error');
            }
          }

          if (selectedCell && selectedCell[0] === r && selectedCell[1] === c && !isWon) {
            cell.classList.add('selected');
          }
          
          cell.innerText = current[r][c] !== 0 ? current[r][c] : '';
          cell.onclick = () => { 
            if (!isWon) {
              selectedCell = [r, c]; 
              if (stickyNum !== null && puzzle[r][c] === 0) {
                current[r][c] = stickyNum;
              }
              render(); 
            }
          };
          board.appendChild(cell);
        }
      }

      renderKeypadState();
      renderAutoCompleteUI(isWon);
    }

    // Only count correctly placed numbers (ignores mistakes/duplicates)
    function getNumberCount(num) {
      let count = 0;
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (current[r][c] === num && current[r][c] === solution[r][c]) {
            count++;
          }
        }
      }
      return count;
    }

    function getNextAvailableNum(startNum) {
      for (let i = 1; i <= 9; i++) {
        let candidate = ((startNum - 1 + i) % 9) + 1;
        if (getNumberCount(candidate) < 9) {
          return candidate;
        }
      }
      return null; 
    }

    function renderKeypadState() {
      if (stickyNum !== null && getNumberCount(stickyNum) === 9) {
        stickyNum = getNextAvailableNum(stickyNum);
      }

      const buttons = document.querySelectorAll('#keypad button');
      buttons.forEach((btn, idx) => {
        if (idx < 9) {
          const num = idx + 1;
          const count = getNumberCount(num);

          if (count === 9) {
            btn.style.visibility = 'hidden';
          } else {
            btn.style.visibility = 'visible';
            if (stickyNum === num) {
              btn.classList.add('sticky');
            } else {
              btn.classList.remove('sticky');
            }
          }
        }
      });
    }

    function renderAutoCompleteUI(isWon) {
      const container = document.getElementById('autocomplete-container');
      container.innerHTML = '';

      if (isWon) return;

      let emptyCells = [];
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (current[r][c] === 0) {
            emptyCells.push({r, c});
          }
        }
      }

      // Offer auto complete when 5 or fewer empty cells are left
      if (emptyCells.length > 0 && emptyCells.length <= 5) {
        const btn = document.createElement('button');
        btn.className = 'auto-btn';
        btn.innerText = `⚡ Auto Complete (${emptyCells.length} left)! ⚡`;
        btn.onclick = triggerAutoComplete;
        container.appendChild(btn);
      }
    }

    function triggerAutoComplete() {
      let emptyCells = [];
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (current[r][c] === 0) {
            emptyCells.push({r, c});
          }
        }
      }

      if (emptyCells.length === 0) return;

      let index = 0;
      function fillNext() {
        if (index < emptyCells.length) {
          let cell = emptyCells[index];
          current[cell.r][cell.c] = solution[cell.r][cell.c];
          render();
          index++;
          setTimeout(fillNext, 250); // Bang, bang, bang - 250ms interval[span_3](start_span)[span_3](end_span)
        }
      }
      fillNext();
    }

    function setupKeypad() {
      const buttons = document.querySelectorAll('#keypad button');
      buttons.forEach((btn, idx) => {
        if (idx < 9) {
          const num = idx + 1;
          let pressTimer = null;
          let isLongPress = false;

          const startPress = () => {
            isLongPress = false;
            pressTimer = setTimeout(() => {
              isLongPress = true;
              if (stickyNum === num) {
                stickyNum = null; 
              } else {
                stickyNum = num; 
              }
              render();
            }, 500); 
          };

          const cancelPress = () => {
            if (pressTimer) {
              clearTimeout(pressTimer);
              pressTimer = null;
            }
          };

          btn.addEventListener('mousedown', startPress);
          btn.addEventListener('mouseup', cancelPress);
          btn.addEventListener('mouseleave', cancelPress);
          btn.addEventListener('touchstart', startPress, { passive: true });
          btn.addEventListener('touchend', cancelPress, { passive: true });
          btn.addEventListener('touchcancel', cancelPress, { passive: true });

          btn.onclick = () => {
            cancelPress();
            if (isLongPress) return;

            if (stickyNum !== null) {
              stickyNum = num;
              render();
            } else {
              if (selectedCell) {
                let [r, c] = selectedCell;
                if (puzzle[r][c] === 0) {
                  current[r][c] = num;
                  render();
                }
              }
            }
          };
        } else {
          // 'C' button
          btn.onclick = () => {
            if (selectedCell) {
              let [r, c] = selectedCell;
              if (puzzle[r][c] === 0) {
                current[r][c] = 0;
                render();
              }
            }
          };
        }
      });
    }

    setupKeypad();
    initGame();
  </script>
</body>
</html>
